name: QA Regression

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  regression:
    name: API Regression Tests
    runs-on: ubuntu-latest

    env:
      Test_Env: qa
      AUTH_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
      API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}

    steps:

      # --------------------------------------------------
      # 1. Checkout automation repository
      # --------------------------------------------------
      - name: Checkout automation code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt


      # --------------------------------------------------
      # 3. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest pytest-playwright playwright pytest-html
          fi


      # --------------------------------------------------
      # 4. Install Playwright browsers
      # --------------------------------------------------
      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps


      # --------------------------------------------------
      # 5. Display test environment & validate secrets
      # --------------------------------------------------
      - name: Display test environment
        run: |
          echo "Test Environment: $Test_Env"
          
          if [ -z "$AUTH_TOKEN" ] && [ -z "$API_BEARER_TOKEN" ]; then
            echo "ERROR: API_BEARER_TOKEN secret is not set!"
            exit 1
          fi

          if [ -z "$CLIENT_ID" ]; then
            echo "ERROR: CLIENT_ID secret is not set!"
            exit 1
          fi

          echo "AUTH_TOKEN character length: ${#AUTH_TOKEN}"
          echo "CLIENT_ID character length: ${#CLIENT_ID}"
          echo "Environment variables validated successfully."


      # --------------------------------------------------
      # 6. Run QA regression tests
      # --------------------------------------------------
      - name: Run QA regression tests
        env:
          Test_Env: qa
          AUTH_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          pytest \
            -v \
            --tb=short \
            --html=report.html \
            --self-contained-html


      # --------------------------------------------------
      # 7. Check report
      # --------------------------------------------------
      - name: Check HTML report
        if: always()
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "HTML report:"
          ls -lh report.html || true


      # --------------------------------------------------
      # 8. Upload HTML test report
      # --------------------------------------------------
      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-html-report
          path: report.html
          if-no-files-found: warn


      # --------------------------------------------------
      # 9. Display test result
      # --------------------------------------------------
      - name: QA Regression Result
        if: always()
        run: |
          echo "======================================"
          echo "       QA REGRESSION COMPLETED"
          echo "======================================"
